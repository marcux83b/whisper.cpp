# EOS defaults tuned for deterministic stdin (f32le @ 16 kHz mono)
# Target utterances:
# 1) "Hello, my name is Marco."
# 2) "This is a test."
#
# Notes:
# - Tuned on mic_test.raw with ggml-large-v3.bin
# - Avoids phantom "Thank you." by filtering short blips and slightly stricter RMS-on
# - Keep other EOS parameters at their standard defaults unless specified

eos-on=0.0105          # enter speech when RMS >= 0.0105 (~ -39.6 dBFS)
eos-off=0.0055         # leave speech when RMS  < 0.0055 (~ -45.2 dBFS)
eos-preroll-ms=350     # prepend 350 ms audio at speech start
eos-hang-ms=350        # keep speech for 350 ms after last loud frame
eos-min-chunk-ms=800   # drop chunks shorter than 800 ms (filters blips)

# Untouched defaults (documented here for clarity):
# eos-flush-zero-ms=1000  # flush if ~1s of zeros observed
# debug-eos=false         # enable with --debug-eos
